# CunFetch - Noah 版配置（已清理作者硬编码）
# 注意：这个文件里不要填任何 Token / 密钥。
# Token 只放在 Cloudflare Worker 的 Secret 里，本地拉取时用环境变量或命令行传入，
# 绝不要把 Token 写进这个文件再提交到 GitHub。

# ----- 博客采集：Noah 版默认关闭 -----
# 作者原版是采他自己的博客 cunzhangblog.com，写进他自己的 Google Sheets。
# 那条线和你的抖音/小红书没有关系，默认关掉。
# 如果你以后有了自己的博客，再把 url 换成你自己的，并把 use_rss 改回 true。
blog:
  url: ""
  rss: ""
  sitemap: ""
  use_rss: false
  use_sitemap: false

# ----- 本地素材存储 -----
# 这是你自己 Windows 电脑上的落盘目录，D 盘不存在就改成你实际的盘符/目录。
storage:
  root: "D:/CunContent"
  log_dir: "logs"

# ----- 图片采集（博客线关闭时用不到，留空即可） -----
images:
  target_count: 5
  allowed_formats: [jpg, jpeg, png, webp]
  min_dimension: 100
  min_file_bytes: 1024
  download_retries: 3
  download_timeout_seconds: 15
  searcher:
    provider: "none"
    bing: { api_key: "" }
    google_cse: { api_key: "", cx: "" }

# ----- 任务队列：Noah 版默认不接作者的表 -----
# 只有你想用 Google Sheets 做任务队列时，才填你自己的表 ID 和你自己的 Service Account。
# 只用 Worker 收件箱（Muse/Antigravity 上传 -> 看板 -> 本地拉取）时，这一段可以全空。
sheets:
  spreadsheet_id: ""
  sheet_name: "CunFetch Tasks"
  credentials_path: "D:/CunContent/credentials/service-account.json"
  credentials_env: "CUNFETCH_SHEETS_CREDENTIALS"

network:
  timeout_seconds: 30
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
  proxy: ""

logging:
  level: "INFO"

schedule:
  timezone: "Asia/Shanghai"
  time: "09:05"

# ----- 4 平台（Noah 版） -----
# 视频线原来只有抖音/B站/视频号，现在加上小红书，一共 4 个。
# platforms.json 里就要按这 4 个键写标题和标签，缺哪个，看板上那个就不显示。
platforms: ["douyin", "xiaohongshu", "bilibili", "shipinhao"]

# ----- R2 / Worker（部署后填） -----
# worker_base_url：部署后 Cloudflare 打印的地址，例如 https://cunfetch.<你的子域名>.workers.dev
# worker_token：不要写在这里！拉取脚本用环境变量 CUNFETCH_TOKEN 或命令行 --token 传入。
r2:
  worker_base_url: ""
  worker_token: ""
  bucket: "cunfetch-inbox"
  prefix: "inbox"
